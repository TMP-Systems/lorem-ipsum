<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorem Ipsum Generator</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 2rem; display: flex; justify-content: center; }
  .container { background: #fff; max-width: 600px; width: 100%; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
  h1 { margin-top: 0; font-size: 1.5rem; }
  .controls { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  label { font-weight: bold; }
  input[type="number"] { width: 70px; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
  button { background-color: #007bff; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
  button:hover { background-color: #0056b3; }
  #output { background: #f8f9fa; border: 1px solid #ddd; padding: 1rem; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 0.9rem; max-height: 300px; overflow-y: auto; margin-bottom: 1rem; }
  .actions { display: flex; justify-content: space-between; align-items: center; }
  .copy-btn { background-color: #28a745; }
  .copy-btn:hover { background-color: #218838; }
  #copyStatus { font-size: 0.85rem; color: #28a745; font-weight: bold; }
</style>
</head>
<body>
  <div class="container">
    <h1>HTML Lorem Ipsum Generator</h1>
    <div class="controls">
      <label for="sentenceCount">Sentences:</label>
      <!-- Added oninput="generateLorem()" here -->
      <input type="number" id="sentenceCount" value="10" min="1" max="100" oninput="generateLorem()">
      <button onclick="generateLorem()">Generate</button>
    </div>
    <div id="output"></div>
    <div class="actions">
      <button class="copy-btn" onclick="copyToClipboard()">Copy Lorem Ipsum</button>
      <span id="copyStatus"></span>
    </div>
  </div>


  <script>
    const loremBank = [
      "Lorem ipsum dolor sit amet, consectetuer adipiscing elit.",
      "Aenean commodo ligula eget dolor.",
      "Aenean massa.",
      "Cum sociis natoque penatibus et magnis dis parturient montes, nascetur ridiculus mus.",
      "Donec quam felis, ultricies nec, pellentesque eu, pretium quis, sem.",
      "Nulla consequat massa quis enim.",
      "Donec pede justo, fringilla vel, aliquet nec, vulputate eget, arcu.",
      "In enim justo, rhoncus ut, imperdiet a, venenatis vitae, justo.",
      "Nullam dictum felis eu pede mollis pretium.",
      "Integer tincidunt.",
      "Cras dapibus.",
      "Vivamus elementum semper nisi.",
      "Aenean vulputate eleifend tellus.",
      "Aenean leo ligula, porttitor eu, consequat vitae, eleifend ac, enim.",
      "Aliquam lorem ante, dapibus in, viverra quis, feugiat a, tellus.",
      "Phasellus viverra nulla ut metus varius laoreet.",
      "Quisque rutrum.",
      "Aenean imperdiet.",
      "Etiam ultricies nisi vel augue.",
      "Curabitur ullamcorper ultricies nisi.",
      "Nam eget dui.",
      "Etiam rhoncus.",
      "Maecenas tempus, tellus eget condimentum rhoncus, sem quam semper libero, sit amet adipiscing sem neque sed ipsum.",
      "Nam quam nunc, blandit vel, luctus pulvinar, hendrerit id, lorem.",
      "Maecenas nec odio et ante tincidunt tempus.",
      "Donec vitae sapien ut libero venenatis faucibus.",
      "Nullam quis ante.",
      "Etiam sit amet orci eget eros faucibus tincidunt.",
      "Duis leo.",
      "Sed fringilla mauris sit amet nibh.",
      "Donec sodales sagittis magna.",
      "Sed consequat, leo eget bibendum sodales, augue velit cursus nunc."
    ];


    function generateLorem() {
      const requestedCount = parseInt(document.getElementById('sentenceCount').value) || 10;
      let paragraphsArray = [];
      let currentParagraphSentences = [];


      for (let i = 0; i < requestedCount; i++) {
        if (i > 0 && i % loremBank.length === 0) {
          paragraphsArray.push('<p>' + currentParagraphSentences.join(' ') + '</p>');
          currentParagraphSentences = [];
        }
        const sequentialSentence = loremBank[i % loremBank.length];
        currentParagraphSentences.push(sequentialSentence);
      }


      if (currentParagraphSentences.length > 0) {
        paragraphsArray.push('<p>' + currentParagraphSentences.join(' ') + '</p>');
      }


      const htmlOutput = paragraphsArray.join('\n\n');
      document.getElementById('output').innerHTML = htmlOutput;
      document.getElementById('copyStatus').textContent = '';
    }


    function copyToClipboard() {
      const outputText = document.getElementById('output').textContent;
      if (!outputText) return;
      navigator.clipboard.writeText(outputText).then(() => {
        const status = document.getElementById('copyStatus');
        status.textContent = 'Copied to clipboard!';
        setTimeout(() => {
          status.textContent = '';
        }, 2500);
      });
    }


    generateLorem();
  </script>
</body>
</html>
